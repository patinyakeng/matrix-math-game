<!--
Matrix Game (Single-File) — HTML/CSS/JS (Light iOS Theme)
Author: Alex (for Patinya/Tin)

เวอร์ชัน "แบบฝึกหัด" (นักเรียนกรอกคำตอบ ส่งขึ้น Google Sheet)
-->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matrix Game – 10 Levels</title>
  <style>
    :root{
      --bg:#f9fafb; --card:#ffffff; --muted:#6b7280; --text:#111827;
      --accent:#007aff; --good:#34c759; --bad:#ff3b30; --warn:#ff9500; --border:#d1d5db;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
    h1{font-size:28px;margin:0 0 12px} h2{font-size:22px;margin:0 0 8px} p{color:var(--muted)}
    label{display:block;margin:8px 0 6px}
    input,button,select{font:inherit}
    input[type="text"],input[type="number"],select{
      width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--text);
    }
    .row{display:flex;gap:16px;flex-wrap:wrap} .col{flex:1 1 220px}
    .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;padding:12px 16px;cursor:pointer}
    .btn-primary{background:var(--accent);color:#fff;font-weight:600}
    .btn-ghost{background:#f3f4f6;border:1px solid var(--border);color:var(--text)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
    .pill{padding:8px 12px;border-radius:999px;background:#f3f4f6;border:1px solid var(--border);color:var(--muted)}
    .grid-nav{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:12px 0 16px}
    .qbtn{padding:10px 0;border-radius:10px;border:1px solid var(--border);background:#f3f4f6;color:#6b7280;cursor:pointer}
    .qbtn.current{outline:2px solid var(--accent);background:#dbeafe;color:#007aff}
    .qbtn.answered{background:#ecfdf5;border-color:#bbf7d0;color:#166534}
    .problem{display:flex;flex-direction:column;gap:12px}

    /* กรอบ matrix */
    .mwrap{display:inline-block;border:1px solid var(--border);border-radius:12px;padding:12px;background:#f9fafb}
    table.matrix{border-collapse:collapse}
    table.matrix td{border:1px solid #cbd5e1;padding:6px 10px;text-align:center;min-width:32px;font-weight:600}

    /* แถว A/B แนวนอน */
    .mx-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
    .badge{font-size:14px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:#fff}

    /* กล่องคำตอบ (ใช้สีเดียวกับหน้าเฉลย) */
    .answer{
      display:inline-block;
      background:#eef2ff;               /* ฟ้าอ่อน (เมทริกซ์) */
      border:2px solid var(--accent);
      border-radius:14px;
      padding:12px;
    }
    .answer-num{
      background:#ecfdf5;               /* เขียวอ่อน (ตัวเลข) */
      border-color:var(--good);
    }

    /* input ในกล่องคำตอบ */
    .grid-input{display:grid;gap:8px}
    .answer .grid-input input{
      width:66px;height:46px;text-align:center;font-weight:700;
      border:1px solid #cbd5e1;border-radius:10px;
    }
    .answer.answer-num input{
      width:180px;height:52px;text-align:center;font-size:22px;font-weight:800;
      border:1px solid #cbd5e1;border-radius:12px;
    }

    .status{margin-top:8px;color:var(--muted)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .end-grid{display:grid;grid-template-columns:1fr;gap:14px}
    .ans-card{border:1px solid var(--border);border-radius:12px;padding:14px;background:#f9fafb}
    .hint{font-size:13px;color:var(--muted)} .ok{color:var(--good)} .no{color:var(--bad)} .warn{color:var(--warn)} .hidden{display:none} .small{font-size:12px}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;}
  </style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN VIEW -->
  <section id="loginView" class="card">
    <h1>Matrix Game by คุณครูปฏิญญา มุ่งหมาย</h1>
    <p>ลงชื่อก่อนทำแบบฝึกหัด กรอกข้อมูลแล้วกด <b>เริ่มทำแบบฝึกหัด</b></p>

    <div class="row">
      <div class="col" style="max-width:180px">
        <label for="title">คำนำหน้า</label>
        <select id="title">
          <option value="นาย">นาย</option>
          <option value="นางสาว">นางสาว</option>
        </select>
      </div>
      <div class="col">
        <label for="firstName">ชื่อจริง</label>
        <input id="firstName" type="text" autocomplete="given-name" />
      </div>
      <div class="col">
        <label for="lastName">นามสกุล</label>
        <input id="lastName" type="text" autocomplete="family-name" />
      </div>
      <div class="col">
        <label for="nickname">ชื่อเล่น</label>
        <input id="nickname" type="text" placeholder="เช่น กาย" />
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="room">ห้อง</label>
        <input id="room" type="text" placeholder="เช่น ม.4/3" />
      </div>
      <div class="col" style="max-width:180px">
        <label for="number">เลขที่</label>
        <input id="number" type="text" placeholder="เช่น 12" />
      </div>
    </div>

    <div class="actions" style="margin-top:14px">
      <button class="btn btn-primary" id="startBtn">เริ่มทำแบบฝึกหัด</button>
    </div>
    <p class="hint small">จัดทำและพัฒนาโดย คุณครูปฏิญญา มุ่งหมาย กลุ่มสาระการเรียนรู้คณิตศาสตร์ โรงเรียนขอนแก่นวิทยายน</p>
  </section>

  <!-- QUIZ VIEW -->
  <section id="quizView" class="card hidden">
    <div class="topbar">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="pill" id="studentTag">นักเรียน: -</span>
        <span class="pill" id="seedTag">ชุดโจทย์: -</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-ghost" id="backBtn">◀ ก่อนหน้า</button>
        <button class="btn btn-ghost" id="nextBtn">ถัดไป ▶</button>
        <button class="btn btn-primary" id="submitBtn" disabled>ส่งคำตอบ</button>
      </div>
    </div>

    <div>
      <h2>เลือกข้อ</h2>
      <div id="navGrid" class="grid-nav"></div>
    </div>

    <div id="problemArea" class="problem"></div>
    <div class="status small" id="statusLine">สถานะ: -</div>
  </section>

  <!-- END VIEW -->
  <section id="endView" class="card hidden">
    <h1>สิ้นสุดการทำแบบฝึกหัด 🎉</h1>
    <p id="scoreLine" style="font-size:18px"></p>

    <div id="answersList" class="end-grid"></div>

    <div class="actions" style="margin-top:16px">
      <button class="btn btn-ghost" id="playAgain">เริ่มแบบฝึกหัดใหม่</button>
      <button class="btn btn-primary" id="backToHome">กลับหน้าแรก</button>
    </div>

    <div id="sheetMsg" class="hint small" style="margin-top:10px"></div>
  </section>

</div>
<script>
// ================== CONFIG ==================
const GAS_URL = "https://script.google.com/macros/s/AKfycbzpuY5hvk61W42K1BnOWcQ1vuanH0K1exyZfXMqtyqZDpmjn5JovhxNxFKYWk-tdVwX/exec";

// ================== UTILITIES ==================
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const deepCopy = (obj) => JSON.parse(JSON.stringify(obj));
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

function makeMatrix(r, c, pick = () => randInt(-9, 9)){
  const m = []; for(let i=0;i<r;i++){ const row=[]; for(let j=0;j<c;j++){ row.push(pick()); } m.push(row); }
  return m;
}
function add(A,B){ const r=A.length, c=A[0].length; const R=makeMatrix(r,c,()=>0); for(let i=0;i<r;i++) for(let j=0;j<c;j++) R[i][j]=A[i][j]+B[i][j]; return R; }
function sub(A,B){ const r=A.length, c=A[0].length; const R=makeMatrix(r,c,()=>0); for(let i=0;i<r;i++) for(let j=0;j<c;j++) R[i][j]=A[i][j]-B[i][j]; return R; }
function scalar(A,k){ const r=A.length, c=A[0].length; const R=makeMatrix(r,c,()=>0); for(let i=0;i<r;i++) for(let j=0;j<c;j++) R[i][j]=A[i][j]*k; return R; }
function transpose(A){ const r=A.length, c=A[0].length; const R=makeMatrix(c,r,()=>0); for(let i=0;i<r;i++) for(let j=0;j<c;j++) R[j][i]=A[i][j]; return R; }
function mul2x2(A,B){ return [[A[0][0]*B[0][0]+A[0][1]*B[1][0], A[0][0]*B[0][1]+A[0][1]*B[1][1]],[A[1][0]*B[0][0]+A[1][1]*B[1][0], A[1][0]*B[0][1]+A[1][1]*B[1][1]]]; }
function det2x2(A){ return A[0][0]*A[1][1] - A[0][1]*A[1][0]; }
function det3x3(M){ const a=M[0][0], b=M[0][1], c=M[0][2]; const d=M[1][0], e=M[1][1], f=M[1][2]; const g=M[2][0], h=M[2][1], i=M[2][2]; return a*e*i + b*f*g + c*d*h - c*e*g - b*d*i - a*f*h; }
function matEq(A,B){ if(A.length!==B.length||A[0].length!==B[0].length) return false; for(let i=0;i<A.length;i++) for(let j=0;j<A[0].length;j++){ if(Number(A[i][j])!==Number(B[i][j])) return false; } return true; }
function fmtMatrixHTML(M){ let html = '<div class="mwrap"><table class="matrix">'; for(let i=0;i<M.length;i++){ html += '<tr>'; for(let j=0;j<M[0].length;j++) html += `<td>${M[i][j]}</td>`; html += '</tr>'; } html += '</table></div>'; return html; }
function fmtAnswerMatrixAsText(M){ return '['+M.map(r=>'['+r.join(', ')+']').join(', ')+']'; }
function randCoefNZ(){ const opts = [-3,-2,-1,1,2,3]; return opts[randInt(0, opts.length-1)]; }
function fmtCoefTerm(k, sym){ if(k===1) return sym; if(k===-1) return '−'+sym; return (k<0? '−'+Math.abs(k): String(k)) + sym; }
function fmtLinComb(k,l){ const a = fmtCoefTerm(k,'A'); const b = (l>=0? ' + ' : ' − ') + (Math.abs(l)===1? 'B' : Math.abs(l)+'B'); return a + b; }

// ================== STATE ==================
const LS_KEY = 'matrix_game_player_v4';
let player = { title:'นาย', firstName:'', lastName:'', nickname:'', room:'', number:'' };
let questions = [];
let currentIndex = 0;
let seed = 0;

// ================== QUESTION GENERATORS ==================
function genQ1(){ const A = makeMatrix(2,3); const B = makeMatrix(2,3); const ans = add(A,B); return { id:1, kind:'matrix', prompt:'ข้อ 1) จงหาเมทริกซ์ A + B', data:{A,B}, size:{r:2,c:3}, answer:ans }; }
function genQ2(){ const A = makeMatrix(3,3); const B = makeMatrix(3,3); const ans = sub(A,B); return { id:2, kind:'matrix', prompt:'ข้อ 2) จงหาเมทริกซ์ A − B', data:{A,B}, size:{r:3,c:3}, answer:ans }; }
function genQ3(){ const A = makeMatrix(2,2); const B = makeMatrix(2,2); const k=randCoefNZ(), l=randCoefNZ(); const ans = add( scalar(A,k), scalar(B,l) ); const expr = fmtLinComb(k,l); return { id:3, kind:'matrix', prompt:`ข้อ 3) จงหาเมทริกซ์ ${expr}`, data:{A,B,k,l}, size:{r:2,c:2}, answer:ans }; }
function genQ4(){ const base = makeMatrix(2,2); const i=randInt(0,1), j=randInt(0,1); const a=randInt(1,3), c=randInt(-5,5), xSol=randInt(-5,5), y=a*xSol+c; const A=deepCopy(base), B=deepCopy(base); A[i][j]=(a===1? 'x':(a+'x'))+(c===0?'':(c>0?('+'+c):c)); B[i][j]=y; return { id:4, kind:'solveX', prompt:'ข้อ 4) ให้เมทริกซ์  A = B จงหาค่าของ x', data:{A,B,a,c,pos:[i,j]}, size:{r:1,c:1}, answer:xSol }; }
function genQ5(){ const A = makeMatrix(2,2); const B = makeMatrix(2,2); const ans = mul2x2(A,B); return { id:5, kind:'matrix', prompt:'ข้อ 5) จงหาเมทริกซ์ A × B', data:{A,B}, size:{r:2,c:2}, answer:ans }; }
function genQ6(){ const A=makeMatrix(2,3), B=makeMatrix(3,2); const op=Math.random()<0.5?'+':'−'; const At=transpose(A); const ans = op==='+'? add(At,B): sub(At,B); return { id:6, kind:'matrix', prompt:`ข้อ 6) จงหาเมทริกซ์ Aᵀ ${op} B`, data:{A,B,op,transposeA:true}, size:{r:3,c:2}, answer:ans }; }
function genQ7(){ const A = makeMatrix(2,2); const B = makeMatrix(2,2); const ans = add( scalar(A,2), scalar(transpose(B),3) ); return { id:7, kind:'matrix', prompt:'ข้อ 7) จงหาเมทริกซ์ 2A + 3Bᵀ', data:{A,B,transposeB:true}, size:{r:2,c:2}, answer:ans }; }
function genQ8(){ const A = makeMatrix(2,2); const ans = det2x2(A); return { id:8, kind:'number', prompt:'ข้อ 8) จงหา det(A)', data:{A}, size:{r:1,c:1}, answer:ans }; }
function genQ9(){ const A = makeMatrix(3,3); const ans = det3x3(A); return { id:9, kind:'number', prompt:'ข้อ 9) จงหา det(A)', data:{A}, size:{r:1,c:1}, answer:ans }; }
function genQ10(){ const A=makeMatrix(2,2), B=makeMatrix(2,2); const k=randCoefNZ(), l=randCoefNZ(); const C=add( scalar(A,k), scalar(B,l) ); const ans=det2x2(C); const expr=fmtLinComb(k,l); return { id:10, kind:'number', prompt:`ข้อ 10) จงหา det ของ ${expr}`, data:{A,B,k,l}, size:{r:1,c:1}, answer:ans }; }

function generateAllQuestions(){
  questions = [genQ1(),genQ2(),genQ3(),genQ4(),genQ5(),genQ6(),genQ7(),genQ8(),genQ9(),genQ10()];
  for(const q of questions){ q.userAnswer = (q.kind==='matrix') ? makeMatrix(q.size.r,q.size.c,()=>'' ) : ''; }
}

// ================== RENDERING ==================
const loginView = document.getElementById('loginView');
const quizView  = document.getElementById('quizView');
const endView   = document.getElementById('endView');
const startBtn  = document.getElementById('startBtn');
const studentTag= document.getElementById('studentTag');
const seedTag   = document.getElementById('seedTag');
const navGrid   = document.getElementById('navGrid');
const problemArea = document.getElementById('problemArea');
const statusLine  = document.getElementById('statusLine');
const submitBtn = document.getElementById('submitBtn');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const scoreLine = document.getElementById('scoreLine');
const answersList = document.getElementById('answersList');
const sheetMsg = document.getElementById('sheetMsg');
const playAgain = document.getElementById('playAgain');
const backToHome = document.getElementById('backToHome');

function show(view){
  loginView.classList.add('hidden'); quizView.classList.add('hidden'); endView.classList.add('hidden');
  view.classList.remove('hidden');
}

/* แสดง A/B แนวนอน (ใช้ซ้ำทั้งหน้าโจทย์และเฉลย) */
function renderQuestionBody(q){
  let html = '';
  if(q.data){
    const A=q.data.A, B=q.data.B;
    if(A || B){
      html += '<div class="mx-row">';
      if(A) html += `<span class="badge">A</span>${fmtMatrixHTML(A)}`;
      if(B) html += ` <span class="badge">B</span>${fmtMatrixHTML(B)}`;
      html += '</div>';
    }
  }
  return html;
}

function restorePlayer(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const obj = JSON.parse(raw); if(obj && obj.firstName){ player = obj; } } }catch(e){}
  document.getElementById('title').value = player.title || 'นาย';
  document.getElementById('firstName').value = player.firstName || '';
  document.getElementById('lastName').value = player.lastName || '';
  document.getElementById('nickname').value = player.nickname || '';
  document.getElementById('room').value = player.room || '';
  document.getElementById('number').value = player.number || '';
}
function savePlayer(){ localStorage.setItem(LS_KEY, JSON.stringify(player)); }

function setupNav(){
  navGrid.innerHTML = '';
  for(let i=0;i<10;i++){
    const b=document.createElement('button');
    b.className='qbtn'; b.textContent=(i+1);
    b.addEventListener('click', ()=>{ currentIndex=i; renderQuestion(); updateNavState(); });
    navGrid.appendChild(b);
  }
  updateNavState();
}
function updateNavState(){
  const kids = Array.from(navGrid.children);
  kids.forEach((btn,idx)=>{ btn.classList.remove('current','answered'); if(idx===currentIndex) btn.classList.add('current');
    const q=questions[idx]; const done = q.kind==='matrix' ? matrixFilled(q.userAnswer) : (q.userAnswer!=='' && q.userAnswer!==null);
    if(done) btn.classList.add('answered');
  });
}
function matrixFilled(M){ for(let i=0;i<M.length;i++) for(let j=0;j<M[0].length;j++){ if(M[i][j]===''||M[i][j]===null) return false; } return true; }

function renderQuestion(){
  const q = questions[currentIndex];
  let body = `<div><strong>${q.prompt}</strong></div>`;
  body += renderQuestionBody(q);                          // A/B แนวนอน

  // กล่องคำตอบ (สีฟ้า = เมทริกซ์, สีเขียว = ตัวเลข)
  const ansClass = q.kind==='matrix' ? 'answer' : 'answer answer-num';
  body += `<div class="${ansClass}">`;
  if(q.kind==='matrix') body += renderMatrixInputs(q);
  else if(q.kind==='number') body += renderNumberInput(q);
  else body += renderSolveXInput(q);
  body += `</div>`;

  body += '<div class="actions"><button class="btn btn-ghost" id="clearBtn">ล้างคำตอบข้อนี้</button></div>';
  problemArea.innerHTML = body;

  document.getElementById('clearBtn').addEventListener('click', ()=>{
    clearCurrentAnswer(); renderQuestion(); refreshSubmitState(); updateNavState();
  });
  if(q.kind==='matrix') attachMatrixInputHandlers(q);
  if(q.kind!=='matrix') attachNumberHandler(q);

  statusLine.textContent = `ข้อ ${q.id} จาก 10`;
}
function renderMatrixInputs(q){
  const r=q.size.r,c=q.size.c;
  let html = `<div class="grid-input" style="grid-template-columns: repeat(${c}, minmax(42px, 72px));">`;
  for(let i=0;i<r;i++) for(let j=0;j<c;j++){
    const val = q.userAnswer[i][j]!==''? q.userAnswer[i][j] : '';
    html += `<input type="number" class="minput" data-i="${i}" data-j="${j}" value="${val}" />`;
  }
  return html + '</div>';
}
function attachMatrixInputHandlers(q){
  problemArea.querySelectorAll('input.minput').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i=Number(inp.getAttribute('data-i')), j=Number(inp.getAttribute('data-j'));
      q.userAnswer[i][j]=inp.value; refreshSubmitState(); updateNavState();
    });
  });
}
function renderNumberInput(q){
  const v=(q.userAnswer!=='' && q.userAnswer!==null)? q.userAnswer:'';
  return `<input type="number" id="ninput" placeholder="พิมพ์คำตอบเป็นจำนวนเต็ม" value="${v}" />`;
}
function renderSolveXInput(q){
  const v=(q.userAnswer!=='' && q.userAnswer!==null)? q.userAnswer:'';
  return `<input type="number" id="ninput" placeholder="ค่า x" value="${v}" />`;
}
function attachNumberHandler(q){
  const inp=document.getElementById('ninput');
  inp.addEventListener('input', ()=>{ q.userAnswer = inp.value; refreshSubmitState(); updateNavState(); });
}
function clearCurrentAnswer(){
  const q=questions[currentIndex];
  if(q.kind==='matrix') q.userAnswer=makeMatrix(q.size.r,q.size.c,()=>'' );
  else q.userAnswer='';
}
function refreshSubmitState(){
  const allDone = questions.every(q=> q.kind==='matrix' ? matrixFilled(q.userAnswer) : (q.userAnswer!=='' && q.userAnswer!==null) );
  submitBtn.disabled=!allDone;
}

// ================== GAME FLOW ==================
startBtn.addEventListener('click', ()=>{
  const title = document.getElementById('title').value.trim();
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const nickname = document.getElementById('nickname').value.trim();
  const room  = document.getElementById('room').value.trim();
  const number= document.getElementById('number').value.trim();
  if(!firstName){ alert('กรุณากรอกชื่อจริง'); return; }
  if(!lastName){ alert('กรุณากรอกนามสกุล'); return; }
  player = { title, firstName, lastName, nickname, room, number }; savePlayer();
  seed = Date.now() % 1000000; generateAllQuestions(); enterQuiz();
});
backBtn.addEventListener('click', ()=>{ currentIndex = clamp(currentIndex-1,0,9); renderQuestion(); updateNavState(); });
nextBtn.addEventListener('click', ()=>{ currentIndex = clamp(currentIndex+1,0,9); renderQuestion(); updateNavState(); });
submitBtn.addEventListener('click', ()=>{
  const results = gradeAll();
  showEnd(results);
  sendToSheet(results);
});
playAgain.addEventListener('click', ()=>{ generateAllQuestions(); currentIndex=0; show(quizView); renderQuestion(); setupNav(); refreshSubmitState(); updateNavState(); });
backToHome.addEventListener('click', ()=>{ show(loginView); });

function enterQuiz(){
  const nickText = player.nickname ? ` • ชื่อเล่น: ${player.nickname}` : '';
  studentTag.textContent = `นักเรียน: ${player.title} ${player.firstName} ${player.lastName} ${player.room? '('+player.room+')':''} ${player.number? '#'+player.number:''}${nickText}`;
  seedTag.textContent = `ชุดโจทย์: ${seed}`;
  currentIndex = 0; show(quizView); renderQuestion(); setupNav(); refreshSubmitState();
}

function gradeAll(){
  let score=0; const detail=[];
  for(const q of questions){
    let correct=false,correctAnsStr='',userAnsStr='';
    if(q.kind==='matrix'){
      correct=matEq(q.userAnswer,q.answer);
      correctAnsStr=fmtAnswerMatrixAsText(q.answer);
      userAnsStr=fmtAnswerMatrixAsText(q.userAnswer);
    } else {
      const userVal=Number(q.userAnswer);
      correct=(userVal===Number(q.answer));
      correctAnsStr=String(q.answer);
      userAnsStr=String(userVal);
    }
    if(correct) score++;
    detail.push({ q:q.id, correct, correctAnswer:correctAnsStr, userAnswer:userAnsStr });
  }
  return { score, total:questions.length, detail };
}

/* เฉลยแบบ “โจทย์เต็ม + คำตอบนักเรียน + คำตอบที่ถูกต้อง” */
function showEnd({score,total,detail}){
  show(endView);
  scoreLine.textContent = `คะแนนรวม: ${score} / ${total}`;
  answersList.innerHTML='';
  for(const d of detail){
    const q=questions.find(qq=>qq.id===d.q);
    const card=document.createElement('div'); card.className='ans-card';
    let html=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
                <div><strong>ข้อ ${q.id}</strong></div>
                <div class="badge ${d.correct?'ok':'no'}">${d.correct?'ถูกต้อง':'ผิด'}</div>
              </div>`;
    html += `<div class="small" style="margin-top:6px"><b>โจทย์:</b> ${q.prompt}</div>`;
    html += renderQuestionBody(q);

    html += `<div class="small" style="margin-top:10px"><b>คำตอบของนักเรียน:</b></div>`;
    if(q.kind==='matrix'){
      html += `<div class="answer" style="border-color:${d.correct?'var(--good)':'var(--bad)'};background:${d.correct?'#ecfdf5':'#fef2f2'}">${fmtMatrixHTML(q.userAnswer)}</div>`;
    }else{
      html += `<div class="answer answer-num" style="border-color:${d.correct?'var(--good)':'var(--bad)'};background:${d.correct?'#ecfdf5':'#fef2f2'}">${d.userAnswer}</div>`;
    }

    html += `<div class="small" style="margin-top:10px"><b>คำตอบที่ถูกต้อง:</b></div>`;
    if(q.kind==='matrix'){
      html += `<div class="answer">${fmtMatrixHTML(q.answer)}</div>`;
    }else{
      html += `<div class="answer answer-num">${d.correctAnswer}</div>`;
    }
    card.innerHTML=html; answersList.appendChild(card);
  }
}
</script>

<script>
/* ===== ส่งคะแนนไป Google Sheet ===== */
async function sendToSheet({score,total,detail}){
  if(!GAS_URL){
    sheetMsg.innerHTML = '<span class="warn">ยังไม่ตั้งค่า Google Sheets URL (GAS_URL)</span>';
    return;
  }

  const payload = {
    game: 'MatrixGame',
    title: player.title,
    firstName: player.firstName,
    lastName: player.lastName,
    nickname: player.nickname,
    room: player.room,
    number: player.number,
    score, total, seed
  };

  const form = new URLSearchParams();
  form.append('payload', JSON.stringify(payload));

  sheetMsg.innerHTML = '<span class="ok">กำลังส่งคะแนน…</span>';

  try {
    const res = await fetch(GAS_URL, { method:'POST', body: form, credentials:'omit' });
    let ok = res.ok;
    try {
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('json')) {
        const js = await res.clone().json();
        ok = ok && (js && js.status === 'ok');
      }
    } catch (_) {}

    if (ok) { sheetMsg.innerHTML = '<span class="ok">ส่งคะแนนไปยัง Google Sheet แล้ว</span>'; return; }
    throw new Error('Non-OK response');
  } catch (err) {
    sheetMsg.innerHTML = '<span class="warn">ส่งคะแนนไม่สำเร็จ กรุณาลองใหม่</span>';
  }
}

// ================== INIT ==================
restorePlayer(); show(loginView);
</script>
